name: Build and publish image

# Builds the Dockerfile in this repo and pushes it to GitHub Container
# Registry (ghcr.io) on every push to main. This is what lets the NAS pull
# a finished, pre-built image instead of building from source itself —
# the actual fix for Container Manager's "Build doesn't pick up changes"
# unreliability, since there's no build step happening on the NAS at all
# anymore, just a plain image pull.

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger a rebuild manually from the Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to this repo's own GHCR namespace

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is automatically provided by Actions for every run —
          # no secret to create or manage.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read VERSION file
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tags as both :latest (what Watchtower watches) and the exact
          # VERSION string (e.g. :2026.09.20.4), so a specific build can
          # always be pulled/rolled back to by tag if latest ever needs
          # to be bypassed.
          tags: |
            ghcr.io/${{ github.repository_owner }}/homeport:latest
            ghcr.io/${{ github.repository_owner }}/homeport:${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
